<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Formulario HTML</title>
</head>
<body>
    <header>
        <h3>Formulários e Inputs</h3>
    </header>
    <main>
        <form id="registerForm" method="POST">
            <label for="nome"> Nome Completo: </label>
            <input type="text" id="nome" name="nome" required/>
            <br>
            <br>
            <label for="email">Endereço de e-mail</label>
            <input type="email" id="email" name="email" required/>
            <br>
            <br>
            <label>Informe sua senha:</label>
            <input 
            type="password" 
            id="senha" 
            name="senha" 
            required minlength="8" 
            title="A senha deve ter no minimo 8 caracteres"
            />
            <br>
            <label for="mensagem">Informe Sua Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento">Selecione o Evento escolhido:</label>
            <!-- Tag de seletor,ao selecionar uma das opções o value da option é atribuído ao name do select -->
            <!-- key: value -->
            <!-- evento:teatro -->
            <select id="evento" name="evento">
                <option value="rock"> Show de Rock</option>
                <option value="modao"> Show de Sertanejo</option>
                <option value="teatro"> Teatro: Comédia</option>
            </select>
            <br>
            <!-- Input checkbox -> Opção de Multipla escolha: -->
        <label for="termos"> 
            <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
        </label>
            <br>
            <!-- Input type radio - Escolha única -->
            <label><input type="radio" name="pagamento" value="pix"/>Pix</label>
            <label><input type="radio" name="pagamento" value="cartao"/>Cartão</label>
            <!-- Para o type radio funcionar ambos os inputs devem compartilhar o mesmo name -->
            <br>
            <input type="date"/>
            <br>
            <input  type="file"/>
            <input type="text" 
            id="cpf"
            cpf="cpf"
            placeholder="000.000.000-00"
            required
            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
            title="Formato esperado: 000.000.000-00"
            />
            <br>
            <input type="submit" value="Cadastrar"/>
            <button type="button" onclick="">Cancelar</button>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por André</p>
    </footer>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event)
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Olá, '+ nome + ' cadastro enviado com sucesso');
        })
    </script>
</body>
</html>
